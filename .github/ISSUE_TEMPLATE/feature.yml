name: Feature
description: User need and intended behavior
title: "[triage] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: "After creation, rename to GL-<issue number>: <outcome>; add to Project #2 and set owner, priority, area and status. Do not publish confidential details."
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: User need and intended behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Include a meaningful failure or edge case.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Linked issue numbers, or None.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Done target
      description: What observable proof makes this complete?
    validations:
      required: true
