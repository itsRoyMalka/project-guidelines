name: Handbook
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: handbook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    name: documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.0'
      - run: python3 --version && node --version
      - run: python3 -m pip install --require-hashes -r .github/checks/requirements.txt
      - run: python3 .github/checks/handbook.py
      - run: python3 -m unittest discover -s .github/checks -p 'test_*.py'
      - run: node --test .github/checks/metadata.test.cjs
      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" HEAD
